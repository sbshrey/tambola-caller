plugins { id 'com.android.application' }

android {
    namespace 'io.github.sbshrey.tambola.keyboard'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.sbshrey.tambola.keyboard'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    def keyPath = System.getenv('TAMBOLA_KEYSTORE_PATH')
    if (keyPath) {
        signingConfigs {
            release {
                storeFile file(keyPath)
                storePassword System.getenv('TAMBOLA_KEYSTORE_PASSWORD')
                keyAlias 'tambola'
                keyPassword System.getenv('TAMBOLA_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (keyPath) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint { abortOnError true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
