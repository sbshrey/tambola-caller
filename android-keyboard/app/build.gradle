plugins { id 'com.android.application' }

android {
    namespace 'io.github.sbshrey.tambola.keyboard'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.sbshrey.tambola.keyboard'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    def keyPath = System.getenv('TAMBOLA_KEYSTORE_PATH')
    if (keyPath) {
        signingConfigs {
            release {
                storeFile file(keyPath)
                storePassword System.getenv('TAMBOLA_KEYSTORE_PASSWORD')
                keyAlias 'tambola'
                keyPassword System.getenv('TAMBOLA_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (keyPath) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    lint { abortOnError true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/voiceAssets')
}

// Package the already-generated website recordings. No API key or network call.
def prepareVoiceAssets = tasks.register('prepareVoiceAssets', Sync) {
    into layout.buildDirectory.dir('generated/voiceAssets/voices')
    ['en': '../audio', 'hi': '../audio/hi', 'hinglish': '../audio/hinglish'].each { language, source ->
        from(rootProject.file(source)) { include 'manifest.json', 'numbers/*.mp3'; into language }
    }
    doLast {
        ['en', 'hi', 'hinglish'].each { language ->
            def folder = layout.buildDirectory.dir("generated/voiceAssets/voices/${language}").get().asFile
            def manifest = new groovy.json.JsonSlurper().parse(new File(folder, 'manifest.json'))
            (1..90).each { number ->
                def clip = manifest.clips[number.toString()]
                def file = new File(folder, String.format('numbers/%02d.mp3', number))
                if (!clip || !file.exists() || java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() != clip.sha256) {
                    throw new GradleException("Missing or changed voice clip: ${language}/${number}")
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn prepareVoiceAssets }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
