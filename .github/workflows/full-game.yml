name: Tambola Together Android
on:
  push:
    paths: ['full-game/**', 'audio/**', '.github/workflows/full-game.yml']
  pull_request:
    paths: ['full-game/**', 'audio/**', '.github/workflows/full-game.yml']
  workflow_dispatch:
    inputs:
      room_capacity:
        description: Run the ten-room, 320-client gameplay capacity check
        type: boolean
        default: false
      automatic_recovery:
        description: Run the full automatic game with two services and recovery faults
        type: boolean
        default: false
      automatic_soak:
        description: Run nine automatic games in ten rooms (about seventy minutes)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  automatic-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.automatic_soak
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tambola_test
          POSTGRES_USER: tambola_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambola_test -d tambola_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAMBOLA_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/tambola_test
      TAMBOLA_TEST_DATABASE_USER: tambola_test
      TAMBOLA_TEST_DATABASE_PASSWORD: isolated-ci-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Verify sustained automatic capacity and rematches
        working-directory: full-game
        run: bash gradlew -PserverOnly=true :server:automaticSoakLoad --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: tambola-automatic-soak
          path: |
            full-game/.test-workspace/soak-*/evidence.json
            full-game/.test-workspace/soak-*/gc.log
            full-game/.test-workspace/soak-*/collection-*.txt
  automatic-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.automatic_recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tambola_test
          POSTGRES_USER: tambola_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambola_test -d tambola_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAMBOLA_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/tambola_test
      TAMBOLA_TEST_DATABASE_USER: tambola_test
      TAMBOLA_TEST_DATABASE_PASSWORD: isolated-ci-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Verify real automatic calling and client recovery
        working-directory: full-game
        run: bash gradlew -PserverOnly=true :server:automaticRecoveryLoad --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: tambola-automatic-recovery
          path: full-game/.test-workspace/automatic-*/evidence.json
  room-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.room_capacity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tambola_test
          POSTGRES_USER: tambola_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambola_test -d tambola_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAMBOLA_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/tambola_test
      TAMBOLA_TEST_DATABASE_USER: tambola_test
      TAMBOLA_TEST_DATABASE_PASSWORD: isolated-ci-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Measure complete games with native clients
        working-directory: full-game
        run: bash gradlew -PserverOnly=true :server:loadTest --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: tambola-room-capacity
          path: |
            full-game/.test-workspace/load-*/evidence.json
            full-game/.test-workspace/load-*/gc.log
  room-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tambola_test
          POSTGRES_USER: tambola_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambola_test -d tambola_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAMBOLA_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/tambola_test
      TAMBOLA_TEST_DATABASE_USER: tambola_test
      TAMBOLA_TEST_DATABASE_PASSWORD: isolated-ci-test-password
      TAMBOLA_PG_BIN: /usr/lib/postgresql/16/bin
      TAMBOLA_PROMTOOL_IMAGE: prom/prometheus@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Install matching PostgreSQL backup tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client-16
      - name: Verify PostgreSQL service, restart, deletion recovery and restricted roles
        working-directory: full-game
        run: |
          node --test tools/test-tcp-byte-meter.mjs
          bash gradlew -PserverOnly=true :domain:test :client:test :server:test :server:installDist :server:historyDeletionLoad --no-daemon --console=plain
          node tools/server-smoke.mjs
          node tools/server-deletion-recovery.mjs
          node tools/server-permissions-smoke.mjs
      - name: Verify constrained runtime image
        working-directory: full-game
        run: |
          docker build --file server/Dockerfile --iidfile .test-workspace/service-image-id.txt .
          TAMBOLA_TEST_SERVICE_IMAGE="$(cat .test-workspace/service-image-id.txt)" node tools/server-permissions-smoke.mjs
      - name: Verify alert rules and actual metric exposition
        working-directory: full-game
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --mount "type=bind,source=$PWD/server/ops,target=/rules,readonly" --workdir /rules --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" check config --syntax-only prometheus.example.yml
          docker run --rm --network=none --read-only --cap-drop=ALL --mount "type=bind,source=$PWD/server/ops,target=/rules,readonly" --workdir /rules --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" check rules alerts.yml
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop=ALL --mount "type=bind,source=$PWD/server/ops,target=/rules,readonly" --workdir /rules --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" test rules alerts.test.yml
          for metrics in .test-workspace/permissions-*/metrics.prom; do
            docker run --rm -i --network=none --read-only --cap-drop=ALL --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" check metrics < "$metrics"
          done
      - name: Review the exact container image and available security fixes
        working-directory: full-game
        run: |
          python3 tools/test-container-advisories.py
          bash tools/check-container-image.sh "$(cat .test-workspace/service-image-id.txt)" .test-workspace/container-review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: tambola-room-service-tests
          path: |
            full-game/server/build/reports/tests/
            full-game/domain/build/reports/tests/
            full-game/client/build/reports/tests/
            full-game/.test-workspace/deletion-process-*/evidence.json
            full-game/.test-workspace/permissions-*/evidence.json
            full-game/.test-workspace/permissions-*/metrics.prom
            full-game/.test-workspace/history-delete-*/evidence.json
            full-game/.test-workspace/container-review/grype.json
            full-game/.test-workspace/container-review/gate.json
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify original sound assets
        run: node full-game/tools/compose-sounds.mjs --check
      - name: Verify English and Hindi resources
        run: python3 full-game/tools/check-localization.py
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Verify dependency review helpers and exact runtime advisories
        working-directory: full-game
        run: |
          python3 tools/test-runtime-advisories.py
          node --test tools/service-runtime.test.mjs
          bash gradlew -I tools/runtime-inventory.gradle runtimeDependencyInventory --no-daemon --console=plain
          python3 tools/check-runtime-advisories.py .test-workspace/runtime-dependencies.json --output .test-workspace/runtime-advisories.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: tambola-runtime-dependency-review
          path: |
            full-game/.test-workspace/runtime-dependencies.json
            full-game/.test-workspace/runtime-advisories.json
      - name: Verify domain and Android build
        working-directory: full-game
        run: |
          bash gradlew :domain:test :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
          bash gradlew :app:lintDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tambola-together-alpha
          path: |
            full-game/app/build/outputs/apk/debug/*.apk
            full-game/app/build/reports/
            full-game/domain/build/reports/tests/
