name: Tambola Together Android
on:
  push:
    paths: ['full-game/**', 'audio/**', '.github/workflows/full-game.yml']
  pull_request:
    paths: ['full-game/**', 'audio/**', '.github/workflows/full-game.yml']
  workflow_dispatch:
    inputs:
      room_capacity:
        description: Run the ten-room, 320-client gameplay capacity check
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  room-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.room_capacity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tambola_test
          POSTGRES_USER: tambola_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambola_test -d tambola_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAMBOLA_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/tambola_test
      TAMBOLA_TEST_DATABASE_USER: tambola_test
      TAMBOLA_TEST_DATABASE_PASSWORD: isolated-ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Measure complete games with native clients
        working-directory: full-game
        run: bash gradlew -PserverOnly=true :server:loadTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tambola-room-capacity
          path: |
            full-game/.test-workspace/load-*/evidence.json
            full-game/.test-workspace/load-*/gc.log
  room-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tambola_test
          POSTGRES_USER: tambola_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambola_test -d tambola_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAMBOLA_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/tambola_test
      TAMBOLA_TEST_DATABASE_USER: tambola_test
      TAMBOLA_TEST_DATABASE_PASSWORD: isolated-ci-test-password
      TAMBOLA_PG_BIN: /usr/lib/postgresql/16/bin
      TAMBOLA_PROMTOOL_IMAGE: prom/prometheus@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install matching PostgreSQL backup tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client-16
      - name: Verify PostgreSQL service, restart, deletion recovery and restricted roles
        working-directory: full-game
        run: |
          bash gradlew -PserverOnly=true :domain:test :client:test :server:test :server:installDist :server:historyDeletionLoad --no-daemon --console=plain
          node tools/server-smoke.mjs
          node tools/server-deletion-recovery.mjs
          node tools/server-permissions-smoke.mjs
      - name: Verify constrained runtime image
        working-directory: full-game
        run: |
          docker build --file server/Dockerfile --iidfile .test-workspace/service-image-id.txt .
          TAMBOLA_TEST_SERVICE_IMAGE="$(cat .test-workspace/service-image-id.txt)" node tools/server-permissions-smoke.mjs
      - name: Verify alert rules and actual metric exposition
        working-directory: full-game
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --mount "type=bind,source=$PWD/server/ops,target=/rules,readonly" --workdir /rules --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" check config --syntax-only prometheus.example.yml
          docker run --rm --network=none --read-only --cap-drop=ALL --mount "type=bind,source=$PWD/server/ops,target=/rules,readonly" --workdir /rules --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" check rules alerts.yml
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop=ALL --mount "type=bind,source=$PWD/server/ops,target=/rules,readonly" --workdir /rules --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" test rules alerts.test.yml
          for metrics in .test-workspace/permissions-*/metrics.prom; do
            docker run --rm -i --network=none --read-only --cap-drop=ALL --entrypoint /bin/promtool "$TAMBOLA_PROMTOOL_IMAGE" check metrics < "$metrics"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tambola-room-service-tests
          path: |
            full-game/server/build/reports/tests/
            full-game/domain/build/reports/tests/
            full-game/client/build/reports/tests/
            full-game/.test-workspace/deletion-process-*/evidence.json
            full-game/.test-workspace/permissions-*/evidence.json
            full-game/.test-workspace/permissions-*/metrics.prom
            full-game/.test-workspace/history-delete-*/evidence.json
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original sound assets
        run: node full-game/tools/compose-sounds.mjs --check
      - name: Verify English and Hindi resources
        run: python3 full-game/tools/check-localization.py
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify domain and Android build
        working-directory: full-game
        run: bash gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tambola-together-alpha
          path: |
            full-game/app/build/outputs/apk/debug/*.apk
            full-game/app/build/reports/
            full-game/domain/build/reports/tests/
